name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            export PATH=$PATH:/usr/local/bin:/usr/bin:/home/$USER/.nvm/versions/node/v22.19.0/bin
            cd /var/www/lafina-webapp

            git pull origin main

            npm ci
            npm run build

            sudo nginx -s reload